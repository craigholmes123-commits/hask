<body>

<div class="quiz-container">
  <div class="header-info">
    <div id="progress">Question 1 of 300</div>
    <button class="reset-btn-small" onclick="resetProgress()">Reset All Save Data</button>
    <div id="scoreDisplay">Score: 0</div>
  </div>
  
  <div class="controls-bar">
    <label><input type="checkbox" id="reverseMode" onchange="loadQuestion()"> Reverse Mode (English $\rightarrow$ Pinyin)</label>
  </div>
  
  <div class="question-container">
    <div class="pinyin-row">
      <h1 id="question">Loading...</h1>
      <button class="speak-btn" id="speakNormal" onclick="playPronunciation(0.8)" title="Normal Speed">🔊</button>
      <button class="speak-btn speak-btn-small" id="speakSlow" onclick="playPronunciation(0.4)" title="Slow Speed">🐢</button>
    </div>
  </div>
  
  <div id="options"></div>
  <div id="feedback"></div>
  
  <div class="navigation" id="navContainer">
    <button id="backBtn" class="nav-btn" onclick="goBack()">&#8592; Back</button>
    <button id="fwdBtn" class="nav-btn" onclick="goForward()">Forward &#8594;</button>
  </div>
</div>

<div class="custom-quiz-section">
  <details>
    <summary>Custom Pinyin Text & History</summary>
    <div class="custom-content">
      <textarea id="textInput" placeholder="Paste a pinyin sentence or paragraph here..."></textarea>
      <button class="nav-btn full-width-btn" onclick="generateCustomQuiz()">Generate Quiz from Pinyin</button>
      
      <div class="history-container">
        <label for="historySelect" style="font-size: 13px; color: #888; text-align: left;">Past Tested Texts History:</label>
        <select id="historySelect" class="history-select" onchange="loadPastText(this.value)">
          <option value="">-- Select a previous text --</option>
        </select>
      </div>
    </div>
  </details>
</div>

let vocab = [...masterDictionary];
let currentQ = 0;
let score = 0;
let waiting = false;
let autoAdvanceTimer;
let answeredQuestions = new Set();
let textHistory = [];

const savedData = localStorage.getItem('hsk1PinyinQuizSave');
if (savedData) {
  const parsed = JSON.parse(savedData);
  vocab = parsed.vocab;
  currentQ = parsed.currentQ;
  score = parsed.score;
  answeredQuestions = new Set(parsed.answeredQuestions);
  textHistory = parsed.textHistory || [];
  updateHistoryDropdown();
}

function saveProgress() {
  const state = {
    vocab: vocab,
    currentQ: currentQ,
    score: score,
    answeredQuestions: Array.from(answeredQuestions),
    textHistory: textHistory
  };
  localStorage.setItem('hsk1PinyinQuizSave', JSON.stringify(state));
}

function resetProgress() {
  localStorage.removeItem('hsk1PinyinQuizSave');
  location.reload();
}

function updateHistoryDropdown() {
  const select = document.getElementById('historySelect');
  select.innerHTML = '<option value="">-- Select a previous text --</option>';
  textHistory.forEach((txt, idx) => {
    let preview = txt.length > 35 ? txt.substring(0, 35) + "..." : txt;
    let opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = `${idx + 1}. ${preview}`;
    select.appendChild(opt);
  });
}

function generateCustomQuiz() {
  const pastedText = document.getElementById('textInput').value.trim().toLowerCase();
  if (!pastedText) {
    alert("Please paste some pinyin text first.");
    return;
  }
  
  if (!textHistory.includes(pastedText)) {
    textHistory.unshift(pastedText);
    if (textHistory.length > 15) textHistory.pop();
    updateHistoryDropdown();
  }
  
  processTextToQuiz(pastedText);
}

function loadPastText(index) {
  if (index === "") return;
  const selectedText = textHistory[index];
  document.getElementById('textInput').value = selectedText;
  processTextToQuiz(selectedText);
}

function processTextToQuiz(pastedText) {
  const sortedDict = [...masterDictionary].sort((a,b) => b.pinyin.length - a.pinyin.length);
  let newVocab = sortedDict.filter(word => pastedText.includes(word.pinyin.toLowerCase()));
  
  if (newVocab.length === 0) {
    alert("No HSK 1 words from your dictionary were found in this pinyin text!");
    return;
  }
  
  vocab = newVocab;
  currentQ = 0;
  score = 0;
  answeredQuestions.clear();
  
  saveProgress();
  loadQuestion();
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playPronunciation(speed = 0.8) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(vocab[currentQ].hanzi);
    utterance.lang = 'zh-CN'; 
    utterance.rate = speed; 
    window.speechSynthesis.speak(utterance);
  }
}

function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  if (type === 'correct') {
    oscillator.type = 'triangle';
    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    oscillator.start(audioCtx.currentTime);
    oscillator.stop(audioCtx.currentTime + 0.15);
  } else {
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    oscillator.start(audioCtx.currentTime);
    oscillator.stop(audioCtx.currentTime + 0.2);
  }
}

function loadQuestion() {
  clearTimeout(autoAdvanceTimer);
  waiting = false;
  document.getElementById('feedback').innerText = "";
  
  const navContainer = document.getElementById('navContainer');
  if (currentQ >= vocab.length) {
    if(navContainer) navContainer.style.display = 'none';
    document.querySelector('.quiz-container').innerHTML = `
      <h1 style="font-size: 36px; margin-bottom: 10px; color: #4facfe;">Quiz Complete!</h1>
      <p style="font-size: 20px; color: #aaa;">Final Score: ${score} / ${vocab.length}</p>
      <button class="restart-btn" onclick="resetProgress()">Reset to Full Dictionary</button>
    `;
    return;
  } else {
    if(navContainer) navContainer.style.display = 'flex';
  }
  
  document.getElementById('progress').innerText = `Question ${currentQ + 1} of ${vocab.length}`;
  document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
  document.getElementById('backBtn').disabled = (currentQ === 0);
  document.getElementById('fwdBtn').disabled = (currentQ >= vocab.length - 1);
  
  const isReverse = document.getElementById('reverseMode').checked;
  const speakNormal = document.getElementById('speakNormal');
  const speakSlow = document.getElementById('speakSlow');

  let correctAnswer, targetProp;

  if (isReverse) {
    document.getElementById('question').innerText = vocab[currentQ].english;
    speakNormal.style.display = 'none';
    speakSlow.style.display = 'none';
    
    correctAnswer = vocab[currentQ].pinyin;
    targetProp = item => item.pinyin;
  } else {
    document.getElementById('question').innerText = vocab[currentQ].pinyin;
    speakNormal.style.display = 'flex';
    speakSlow.style.display = 'flex';
    playPronunciation(0.8);

    correctAnswer = vocab[currentQ].english;
    targetProp = item => item.english;
  }
  
  let options = [correctAnswer];
  while (options.length < 4 && options.length < masterDictionary.length) {
    let randomItem = masterDictionary[Math.floor(Math.random() * masterDictionary.length)];
    let optionValue = targetProp(randomItem);
    if (!options.includes(optionValue)) options.push(optionValue);
  }
  options.sort(() => Math.random() - 0.5); 
  
  let optionsHtml = '';
  options.forEach(opt => {
    let safeOpt = opt.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    optionsHtml += `<button class="option" data-answer="${safeOpt}" onclick="checkAnswer(this, '${correctAnswer.replace(/'/g, "\\'")}')">${opt}</button>`;
  });
  document.getElementById('options').innerHTML = optionsHtml;
}

function checkAnswer(btn, correctAnswer) {
  if (waiting) return;
  waiting = true;
  
  let tempDiv = document.createElement('div');
  tempDiv.innerHTML = btn.getAttribute('data-answer');
  let selected = tempDiv.textContent || tempDiv.innerText || "";
  
  const isCorrect = selected === correctAnswer;
  const alreadyAnswered = answeredQuestions.has(currentQ);
  
  if (isCorrect) {
    playSound('correct');
    btn.classList.add('correct');
    document.getElementById('feedback').innerText = "Correct!";
    document.getElementById('feedback').style.color = "#95d5b2";
    
    if (!alreadyAnswered) {
      score++;
      answeredQuestions.add(currentQ);
    }
  } else {
    playSound('incorrect');
    btn.classList.add('incorrect');
    document.getElementById('feedback').innerText = "Incorrect!";
    document.getElementById('feedback').style.color = "#ffb3b3";
    
    if (!alreadyAnswered) {
      vocab.push(vocab[currentQ]); 
      answeredQuestions.add(currentQ);
    }
    
    document.querySelectorAll('.option').forEach(b => {
      tempDiv.innerHTML = b.getAttribute('data-answer');
      let currentOpt = tempDiv.textContent || tempDiv.innerText || "";
      if (currentOpt === correctAnswer) {
        b.classList.add('correct');
      }
    });
  }
  
  document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
  saveProgress();
  
  autoAdvanceTimer = setTimeout(() => {
    currentQ++;
    saveProgress();
    loadQuestion();
  }, 1200);
}

function goBack() {
  if (currentQ > 0) {
    currentQ--;
    saveProgress();
    loadQuestion();
  }
}

function goForward() {
  if (currentQ < vocab.length - 1) {
    currentQ++;
    saveProgress();
    loadQuestion();
  }
}

document.addEventListener('keydown', (e) => {
  if (waiting) return;
  if (document.activeElement.id === 'textInput') return;

  const optionsDiv = document.getElementById('options');
  const buttons = optionsDiv.getElementsByTagName('button');
  
  if (e.key >= '1' && e.key <= '4') {
    const index = parseInt(e.key) - 1;
    if (buttons[index]) buttons[index].click();
  } else if (e.key === 'ArrowRight' && !document.getElementById('fwdBtn').disabled) {
    goForward();
  } else if (e.key === 'ArrowLeft' && !document.getElementById('backBtn').disabled) {
    goBack();
  }
});

loadQuestion();
</script>
